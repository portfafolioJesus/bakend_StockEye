# Panel web (SPA) + proxy de la API. Un solo origen: sin CORS en producción.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;            # fotos de celular de hasta 15 MB

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Tiempo real (SSE): sin buffer y con conexión larga
    location = /api/v1/eventos {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    # Subida de modelos .onnx (~55 MB)
    location = /api/v1/admin/modelos {
        client_max_body_size 300m;
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
